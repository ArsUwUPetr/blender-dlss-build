name: Build Blender with DLSS PR

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Free Disk Space on Runner
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force "C:\Program Files\Android" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\hostedtoolcache\windows\Java" -ErrorAction SilentlyContinue

      - name: Enable long paths in Git
        shell: pwsh
        run: |
          git config --system core.longpaths true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 1. Установка CUDA через Chocolatey
      - name: Install CUDA Toolkit via Chocolatey
        shell: pwsh
        run: |
          choco install cuda --no-progress -y
          $cudaDir = (Get-Item "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v*").FullName | Select-Object -Last 1
          Write-Host "CUDA Installed at: $cudaDir"
          echo "CUDA_PATH=$cudaDir" >> $env:GITHUB_ENV
          echo "CUDA_TOOLKIT_ROOT_DIR=$cudaDir" >> $env:GITHUB_ENV
          echo "$cudaDir\bin" >> $env:GITHUB_PATH

      # 2. Загрузка OptiX 8/9 и DLSS SDK заголовков
      - name: Setup OptiX & DLSS Headers
        shell: bash
        run: |
          git clone --depth 1 https://github.com/NVIDIA/optix-dev.git optix
          git clone --depth 1 https://github.com/NVIDIA/DLSS.git nvidia_dlss
          cp -r nvidia_dlss/include/* optix/include/

      # 3. Клонирование PR #153077 и ВКЛЮЧЕНИЕ WITH_DLSS
      - name: Clone Blender Source and Enable DLSS
        shell: bash
        run: |
          git clone --depth 1 https://projects.blender.org/blender/blender.git src
          cd src
          git fetch origin refs/pull/153077/head:dlss-pr
          git checkout dlss-pr
          cp -r ../optix/include/* intern/cycles/integrator/ || true
          
          # ВКЛЮЧАЕМ DLSS В КОНФИГУРАЦИИ СБОРКИ:
          echo 'set(WITH_DLSS ON CACHE BOOL "" FORCE)' >> build_files/cmake/config/blender_release.cmake
          # Ограничиваем CUDA только картами RTX для быстрой сборки (15-20 мин):
          echo 'set(CYCLES_CUDA_BINARIES_ARCH "sm_75;sm_86;sm_89" CACHE STRING "" FORCE)' >> build_files/cmake/config/blender_release.cmake

      # 4. Загрузка библиотек Blender
      - name: Download Precompiled Libraries
        shell: cmd
        run: |
          cd src
          python build_files\utils\make_update.py --no-blender

      # 5. Сборка Blender через Ninja
      - name: Build Blender with CUDA, OptiX & DLSS
        shell: cmd
        env:
          OPTIX_ROOT_DIR: ${{ github.workspace }}\optix
          DLSS_SDK_ROOT: ${{ github.workspace }}\nvidia_dlss
        run: |
          cd src
          make.bat release ninja

      # 6. Автоматический поиск blender.exe, подкладывание DLL и архивация
      - name: Package Blender and DLSS DLLs
        if: success()
        shell: pwsh
        run: |
          $blenderExe = Get-ChildItem -Path .. -Filter "blender.exe" -Recurse | Select-Object -First 1
          if (-not $blenderExe) {
              $blenderExe = Get-ChildItem -Path . -Filter "blender.exe" -Recurse | Select-Object -First 1
          }
          if (-not $blenderExe) {
              Write-Error "blender.exe not found!"
              exit 1
          }

          $binDir = $blenderExe.DirectoryName
          Write-Host "Blender directory found: $binDir"

          # Копируем DLL Ray Reconstruction прямо к blender.exe
          Copy-Item "nvidia_dlss\lib\Windows_x86_64\rel\*.dll" -Destination $binDir -Force

          # Сжимаем всю папку с Blender
          7z a -mx=5 blender-dlss-win64.zip "$binDir\*"

      # 7. Выгрузка готового архива
      - name: Archive Build Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Blender-DLSS-Windows-x64
          path: blender-dlss-win64.zip
          retention-days: 2
