name: Build Blender with DLSS PR

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Free Disk Space
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force "C:\Program Files\Android" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\hostedtoolcache\windows\Java" -ErrorAction SilentlyContinue

      - name: Enable long paths in Git
        shell: pwsh
        run: |
          git config --system core.longpaths true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 1. Надежная установка CUDA через Chocolatey
      - name: Install CUDA Toolkit via Chocolatey
        shell: pwsh
        run: |
          choco install cuda --no-progress -y
          # Находим путь установки и экспортируем в окружение GitHub Actions
          $cudaDir = (Get-Item "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v*").FullName | Select-Object -Last 1
          Write-Host "CUDA Installed at: $cudaDir"
          echo "CUDA_PATH=$cudaDir" >> $env:GITHUB_ENV
          echo "CUDA_TOOLKIT_ROOT_DIR=$cudaDir" >> $env:GITHUB_ENV
          echo "$cudaDir\bin" >> $env:GITHUB_PATH

      # 2. Скачивание OptiX 8.0 SDK Headers и DLSS SDK Headers
      - name: Setup OptiX & DLSS Headers
        shell: bash
        run: |
          mkdir -p optix/include
          
          # Заголовки OptiX 8.0
          git clone --depth 1 https://github.com/NVIDIA/OptiX_Apps.git optix_apps
          cp -r optix_apps/3rdparty/OptiX/include/* optix/include/

          # Заголовки NVIDIA DLSS SDK (nvsdk_ngx.h и др.)
          git clone --depth 1 https://github.com/NVIDIA/DLSS.git nvidia_dlss
          cp -r nvidia_dlss/include/* optix/include/

      # 3. Клонирование исходников Blender и PR #153077
      - name: Clone Blender Source and PR
        shell: bash
        run: |
          git clone --depth 1 https://projects.blender.org/blender/blender.git src
          cd src
          git fetch origin refs/pull/153077/head:dlss-pr
          git checkout dlss-pr
          
          # Копируем заголовки DLSS в папки Cycles
          cp -r ../optix/include/* intern/cycles/integrator/ || true

      # 4. Загрузка стандартных зависимостей Blender
      - name: Download Precompiled Libraries
        shell: cmd
        run: |
          cd src
          python build_files\utils\make_update.py --no-blender

      # 5. Сборка Blender с включенными CUDA, OptiX и DLSS
      - name: Build Blender with CUDA, OptiX & DLSS
        shell: cmd
        env:
          OPTIX_ROOT_DIR: ${{ github.workspace }}\optix
        run: |
          cd src
          make.bat release -- -DWITH_CYCLES_CUDA_BINARIES=ON -DWITH_CYCLES_DEVICE_OPTIX=ON -DOPTIX_ROOT_DIR="%OPTIX_ROOT_DIR%"

      # 6. Копирование библиотек нейросети DLSS Ray Reconstruction в папку с программой
      - name: Copy DLSS Runtime DLLs to Build Directory
        shell: bash
        run: |
          mkdir -p build_windows_Full_x64_vc17_Release/bin
          cp nvidia_dlss/lib/Windows_x86_64/rel/*.dll build_windows_Full_x64_vc17_Release/bin/ || true

      # 7. Сжатие в ZIP
      - name: Compress Blender with 7-Zip
        if: success()
        shell: pwsh
        run: |
          7z a -mx=7 blender-dlss-win64.zip .\build_windows_Full_x64_vc17_Release\bin\*

      # 8. Выгрузка готового архива
      - name: Archive Build Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Blender-DLSS-Windows-x64
          path: blender-dlss-win64.zip
          retention-days: 2
